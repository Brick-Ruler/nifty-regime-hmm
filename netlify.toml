[build]
  publish = "."
  functions = "netlify/functions"

[functions."trigger_premarket"]
  schedule = "20 3 * * 1-5"

[functions."trigger_morning"]
  schedule = "50 3 * * 1-5"

[functions."trigger_eod"]
  schedule = "45 9 * * 1-5"

[functions."trigger_sunday"]
  schedule = "0 16 * * 0"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
