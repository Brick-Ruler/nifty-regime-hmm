name: NIFTY EOD Hamilton Markov Regime Engine

on:
  schedule:
    # Backup trigger: 09:45 AM UTC is 03:15 PM IST
    - cron: '45 9 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force execution outside market window'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  eod-rebalance-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute EOD Regime Rebalance
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          echo "=========================================================="
          echo "GitHub Actions Cloud Execution - EOD Hamilton Markov Scan (03:15 PM IST)"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================================="
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo ">>> Force execution requested. Bypassing schedule window check..."
            python auto_portfolio_agent.py --eod-check --force
          else
            python auto_portfolio_agent.py --eod-check
          fi

      - name: Commit & Push Updated Portfolio Ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_ledger.json live_quotes.json
          git add *.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No ledger changes to commit."
          else
            git commit -m "Automated EOD rebalance update: $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
