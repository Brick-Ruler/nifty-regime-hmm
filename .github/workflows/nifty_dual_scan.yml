name: NIFTY Autonomous Triple-Scan Portfolio Engine

on:
  schedule:
    # 03:20 AM UTC is 08:50 AM IST (Pre-Market Intelligence & News Filter)
    - cron: '20 3 * * 1-5'
    # 03:55 AM UTC is 09:25 AM IST (Morning Gap Circuit Breaker)
    - cron: '55 3 * * 1-5'
    # 09:45 AM UTC is 03:15 PM IST (EOD Markov & Volatility Rebalance)
    - cron: '45 9 * * 1-5'
  workflow_dispatch:
    inputs:
      scan_mode:
        description: 'Scan Mode to Execute'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - premarket
          - morning
          - eod

permissions:
  contents: write

jobs:
  run-portfolio-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine Scan Mode & Execute Agent
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          CURRENT_HOUR=$(date -u +%H)
          CURRENT_MIN=$(date -u +%M)
          MODE="${{ github.event.inputs.scan_mode }}"

          if [ "$MODE" = "premarket" ] || ([ "$MODE" = "auto" ] && [ "$CURRENT_HOUR" -eq 3 ] && [ "$CURRENT_MIN" -le 35 ]); then
            echo ">>> Executing Pre-Market Sentinel (08:50 AM IST Scan)..."
            python pre_market_sentinel.py
          elif [ "$MODE" = "morning" ] || ([ "$MODE" = "auto" ] && [ "$CURRENT_HOUR" -ge 3 ] && [ "$CURRENT_HOUR" -lt 6 ]); then
            echo ">>> Executing Morning Gap Circuit Breaker (09:25 AM IST Scan)..."
            python auto_portfolio_agent.py --morning-check
          elif [ "$MODE" = "eod" ] || ([ "$MODE" = "auto" ] && [ "$CURRENT_HOUR" -ge 9 ] && [ "$CURRENT_HOUR" -le 11 ]); then
            echo ">>> Executing EOD Markov Regime Rebalance Scan (03:15 PM IST Scan)..."
            python auto_portfolio_agent.py
          else
            echo ">>> Outside valid market scan hours (UTC: ${CURRENT_HOUR}:${CURRENT_MIN}). Suppressing execution to prevent stale off-hour alerts."
          fi

      - name: Commit & Push Updated Portfolio Ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_ledger.json live_quotes.json
          git add *.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No ledger changes to commit today."
          else
            git commit -m "Automated ledger update: $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
