name: NIFTY Sunday Night Macro Sentinel

on:
  schedule:
    # 16:00 UTC Sunday is 09:30 PM IST Sunday (US Futures Open)
    - cron: '0 16 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force execution outside Sunday window'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  sunday-macro-sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Sunday Night Macro & Pre-Flagging Sentinel
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: |
          echo "=========================================================="
          echo "GitHub Actions Cloud Execution - Sunday Night Sentinel (09:30 PM IST)"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "=========================================================="
          python sunday_night_sentinel.py --cloud

      - name: Commit & Push Weekend Risk Flag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_ledger.json latest_sunday_brief.html 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No weekend flag changes to commit."
          else
            git commit -m "Automated Sunday night macro flag: $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
