name: NIFTY Live Quotes Feed Sentinel

on:
  schedule:
    # Run every 15 minutes during Indian Market Hours (09:15 AM to 03:30 PM IST = 03:45 to 10:00 UTC, Mon-Fri)
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch Real-Time NSE Quotes
        run: |
          python update_live_quotes.py

      - name: Commit & Push Live Quotes Feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_quotes.json
          if git diff --staged --quiet; then
            echo "No price delta detected."
          else
            git commit -m "Live market quote tick: $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
          fi
